<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101a30">
  <title>Skycast — Weather, at a glance</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --ink: #f4f7ff;
      --muted: #a4afc5;
      --line: rgba(255, 255, 255, .12);
      --panel: rgba(255, 255, 255, .075);
      --accent: #9ce8e1;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 75% 4%, rgba(86, 116, 179, .3), transparent 38rem),
        radial-gradient(ellipse at 6% 52%, rgba(29, 117, 137, .2), transparent 34rem),
        #101a30;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 22px;
    }

    header, .brand, .search, .location-line, .forecast-heading, .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header { gap: 20px; margin-bottom: 54px; }
    .brand { justify-content: flex-start; gap: 12px; }
    .brand-mark { font-size: 30px; }
    .brand-name { font-size: 19px; font-weight: 750; letter-spacing: -.04em; }
    .brand-caption { margin-top: 2px; color: var(--muted); font-size: 12px; }

    .search {
      width: min(340px, 100%);
      gap: 8px;
      padding: 6px 7px 6px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .06);
    }

    .search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
    }

    .search input::placeholder { color: #a4afc5; }
    .search button, .location-button {
      flex: 0 0 auto;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
    }

    .search button {
      padding: 9px 15px;
      color: #10202e;
      background: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }

    .location-button {
      display: block;
      margin: 12px 0 0 auto;
      padding: 0;
      color: var(--accent);
      background: transparent;
      font-size: 12px;
    }

    button:hover { filter: brightness(1.08); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .hero {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      align-items: center;
      gap: 36px;
      min-height: 270px;
      padding: 32px 42px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(115deg, rgba(255, 255, 255, .105), rgba(255, 255, 255, .035));
      box-shadow: 0 24px 80px rgba(0, 0, 0, .13);
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .location-line { justify-content: flex-start; gap: 9px; margin-top: 9px; }
    h1 { margin: 0; font-size: clamp(29px, 4vw, 42px); letter-spacing: -.055em; }
    .date { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .temperature { margin-top: 23px; font-size: clamp(70px, 11vw, 112px); font-weight: 300; line-height: .95; letter-spacing: -.09em; }
    .temperature span { font-size: .45em; vertical-align: top; letter-spacing: -.04em; }
    .condition { margin: 9px 0 0; color: #d3d9e8; font-size: 16px; }
    .weather-art { justify-self: center; font-size: clamp(110px, 18vw, 174px); line-height: 1; filter: drop-shadow(0 12px 28px rgba(255, 202, 102, .16)); }
    .status { min-height: 20px; margin: 13px 0 0; color: var(--muted); font-size: 13px; }

    .section-title { margin: 35px 0 14px; font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
    .details, .forecast {
      display: grid;
      gap: 12px;
    }
    .details { grid-template-columns: repeat(4, 1fr); }
    .detail, .day {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
    }
    .detail { min-height: 112px; padding: 18px; }
    .detail-label { color: var(--muted); font-size: 12px; }
    .detail-value { margin-top: 15px; font-size: 22px; font-weight: 650; letter-spacing: -.04em; }
    .detail-icon { margin-right: 7px; font-size: 15px; }

    .forecast-heading { margin: 34px 0 14px; }
    .forecast-heading .section-title { margin: 0; }
    .forecast-note { color: var(--muted); font-size: 12px; }
    .forecast { grid-template-columns: repeat(5, 1fr); }
    .day { padding: 17px 12px; text-align: center; }
    .day-name { font-size: 13px; font-weight: 650; }
    .day-icon { margin: 15px 0; font-size: 29px; }
    .day-condition { min-height: 16px; color: var(--muted); font-size: 11px; }
    .day-temps { margin-top: 12px; font-size: 14px; font-weight: 650; }
    .day-temps span { margin-left: 6px; color: var(--muted); font-weight: 450; }

    .footer {
      justify-content: center;
      gap: 5px;
      margin-top: 36px;
      color: var(--muted);
      font-size: 12px;
    }
    .footer strong { color: #dce5f4; font-weight: 600; }

    @media (max-width: 700px) {
      .page { width: min(100% - 28px, 520px); padding-top: 22px; }
      header { align-items: flex-start; flex-direction: column; margin-bottom: 27px; }
      .search-wrap { width: 100%; }
      .search { width: 100%; }
      .location-button { margin-right: 4px; }
      .hero { grid-template-columns: 1fr auto; gap: 6px; min-height: 240px; padding: 26px 23px; }
      .weather-art { font-size: clamp(83px, 22vw, 130px); }
      .temperature { font-size: clamp(68px, 17vw, 94px); }
      .details { grid-template-columns: repeat(2, 1fr); }
      .forecast { gap: 7px; }
      .day { padding: 14px 5px; }
      .day-condition { display: none; }
      .day-temps { font-size: 12px; }
      .day-temps span { margin-left: 3px; }
    }

    @media (max-width: 370px) {
      .forecast { grid-template-columns: repeat(3, 1fr); }
      .hero { grid-template-columns: 1fr; }
      .weather-art { display: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand" aria-label="Skycast weather">
        <span class="brand-mark" aria-hidden="true">🌤️</span>
        <div>
          <div class="brand-name">skycast</div>
          <div class="brand-caption">A little clarity for your day</div>
        </div>
      </div>
      <div class="search-wrap">
        <form class="search" id="search-form">
          <input id="city-input" type="search" placeholder="Search a city..." aria-label="Search a city" autocomplete="off">
          <button type="submit">Search</button>
        </form>
        <button class="location-button" id="location-button" type="button">◎ Use my location</button>
      </div>
    </header>

    <section class="hero" aria-live="polite">
      <div>
        <div class="eyebrow">Current weather</div>
        <div class="location-line">
          <h1 id="city-name">Loading...</h1>
          <span aria-hidden="true">📍</span>
        </div>
        <p class="date" id="current-date"></p>
        <div class="temperature"><span id="temperature">--</span><span>°</span></div>
        <p class="condition" id="condition">Getting the latest forecast</p>
        <p class="status" id="status" role="status"></p>
      </div>
      <div class="weather-art" id="weather-icon" aria-hidden="true">🌤️</div>
    </section>

    <h2 class="section-title">Today's highlights</h2>
    <section class="details" aria-label="Weather details">
      <article class="detail">
        <div class="detail-label">Feels like</div>
        <div class="detail-value"><span class="detail-icon">🌡️</span><span id="feels-like">--</span></div>
      </article>
      <article class="detail">
        <div class="detail-label">Humidity</div>
        <div class="detail-value"><span class="detail-icon">💧</span><span id="humidity">--</span></div>
      </article>
      <article class="detail">
        <div class="detail-label">Wind speed</div>
        <div class="detail-value"><span class="detail-icon">💨</span><span id="wind">--</span></div>
      </article>
      <article class="detail">
        <div class="detail-label">UV index</div>
        <div class="detail-value"><span class="detail-icon">☀️</span><span id="uv">--</span></div>
      </article>
    </section>

    <section aria-label="Five-day forecast">
      <div class="forecast-heading">
        <h2 class="section-title">5-day forecast</h2>
        <span class="forecast-note">Temperature · °C</span>
      </div>
      <div class="forecast" id="forecast"></div>
    </section>

    <footer class="footer">Designed &amp; developed by <strong>Devansh Pundir</strong></footer>
  </main>

  <script>
    const weatherTypes = {
      0: ["Clear sky", "☀️"],
      1: ["Mostly clear", "🌤️"],
      2: ["Partly cloudy", "⛅"],
      3: ["Overcast", "☁️"],
      45: ["Foggy", "🌫️"],
      48: ["Icy fog", "🌫️"],
      51: ["Light drizzle", "🌦️"],
      53: ["Drizzle", "🌦️"],
      55: ["Heavy drizzle", "🌧️"],
      56: ["Freezing drizzle", "🌧️"],
      57: ["Freezing drizzle", "🌧️"],
      61: ["Light rain", "🌦️"],
      63: ["Rain", "🌧️"],
      65: ["Heavy rain", "🌧️"],
      66: ["Freezing rain", "🌧️"],
      67: ["Heavy freezing rain", "🌧️"],
      71: ["Light snow", "🌨️"],
      73: ["Snow", "🌨️"],
      75: ["Heavy snow", "❄️"],
      77: ["Snow grains", "🌨️"],
      80: ["Rain showers", "🌦️"],
      81: ["Rain showers", "🌧️"],
      82: ["Heavy showers", "🌧️"],
      85: ["Snow showers", "🌨️"],
      86: ["Heavy snow showers", "❄️"],
      95: ["Thunderstorm", "⛈️"],
      96: ["Thunderstorm & hail", "⛈️"],
      99: ["Thunderstorm & hail", "⛈️"]
    };

    const $ = (id) => document.getElementById(id);
    const dateFormatter = new Intl.DateTimeFormat(undefined, {
      weekday: "long", month: "long", day: "numeric"
    });

    function weatherFor(code) {
      return weatherTypes[code] || ["Weather conditions", "🌤️"];
    }

    function renderForecast(daily) {
      $("forecast").innerHTML = daily.time.slice(0, 5).map((date, index) => {
        const [label, icon] = weatherFor(daily.weather_code[index]);
        const dayName = index === 0
          ? "Today"
          : new Intl.DateTimeFormat(undefined, { weekday: "short", timeZone: "UTC" })
              .format(new Date(date + "T12:00:00Z"));
        return `<article class="day">
          <div class="day-name">${dayName}</div>
          <div class="day-icon" aria-hidden="true">${icon}</div>
          <div class="day-condition">${label}</div>
          <div class="day-temps">${Math.round(daily.temperature_2m_max[index])}° <span>${Math.round(daily.temperature_2m_min[index])}°</span></div>
        </article>`;
      }).join("");
    }

    async function loadWeather(latitude, longitude, city, country) {
      $("status").textContent = "Loading forecast...";
      try {
        const url = new URL("https://api.open-meteo.com/v1/forecast");
        url.search = new URLSearchParams({
          latitude,
          longitude,
          current: "temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m",
          daily: "weather_code,temperature_2m_max,temperature_2m_min,uv_index_max",
          timezone: "auto",
          forecast_days: "5"
        });
        const response = await fetch(url);
        if (!response.ok) throw new Error("Weather data is temporarily unavailable.");
        const data = await response.json();
        const current = data.current;
        const [condition, icon] = weatherFor(current.weather_code);

        $("city-name").textContent = city;
        $("current-date").textContent = `${country ? `${country} · ` : ""}${dateFormatter.format(new Date())}`;
        $("temperature").textContent = Math.round(current.temperature_2m);
        $("condition").textContent = condition;
        $("weather-icon").textContent = icon;
        $("feels-like").textContent = `${Math.round(current.apparent_temperature)}°`;
        $("humidity").textContent = `${current.relative_humidity_2m}%`;
        $("wind").textContent = `${Math.round(current.wind_speed_10m)} km/h`;
        $("uv").textContent = data.daily.uv_index_max[0] ?? "--";
        renderForecast(data.daily);
        $("status").textContent = "";
      } catch (error) {
        $("status").textContent = error.message || "Couldn't load the weather. Please try again.";
      }
    }

    async function searchCity(city) {
      const query = city.trim();
      if (!query) {
        $("status").textContent = "Enter a city name to search.";
        return;
      }
      $("status").textContent = "Searching...";
      try {
        const url = new URL("https://geocoding-api.open-meteo.com/v1/search");
        url.search = new URLSearchParams({ name: query, count: "1", language: "en", format: "json" });
        const response = await fetch(url);
        if (!response.ok) throw new Error("City search is temporarily unavailable.");
        const data = await response.json();
        if (!data.results || !data.results.length) throw new Error("City not found. Try another name.");
        const place = data.results[0];
        await loadWeather(place.latitude, place.longitude, place.name, place.country);
      } catch (error) {
        $("status").textContent = error.message || "Couldn't search for that city. Please try again.";
      }
    }

    $("search-form").addEventListener("submit", (event) => {
      event.preventDefault();
      searchCity($("city-input").value);
    });

    $("location-button").addEventListener("click", () => {
      if (!navigator.geolocation) {
        $("status").textContent = "Location isn't supported by this browser.";
        return;
      }
      $("status").textContent = "Finding your location...";
      navigator.geolocation.getCurrentPosition(
        ({ coords }) => loadWeather(coords.latitude, coords.longitude, "Your location", ""),
        () => { $("status").textContent = "Location access was unavailable. Search for a city instead."; }
      );
    });

    $("current-date").textContent = dateFormatter.format(new Date());
    searchCity("London");
  </script>
</body>
</html>
